name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod/go.sum are tidy
        run: |
            go mod tidy
            git diff --exit-code -- go.mod go.sum

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
